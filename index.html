<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171614">
  <title>Net Zero Scotland Projects Conference 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="reader" aria-label="Flipbook reader">
    <header class="brand">
      <img src="./Asset%2042@4x.png" alt="Brand logo">
    </header>

    <div class="stage" id="stage">
      <div class="book" id="book" aria-live="off"></div>
    </div>

    <nav class="controls" aria-label="Book navigation">
      <button class="nav-button" id="previous" type="button" aria-label="Previous page">
        <span aria-hidden="true">&#8592;</span>
      </button>
      <p class="page-status" id="pageStatus" aria-live="polite"></p>
      <button class="nav-button" id="next" type="button" aria-label="Next page">
        <span aria-hidden="true">&#8594;</span>
      </button>
    </nav>

    <p class="hint">Drag a page, swipe, click, or use the arrow keys</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
